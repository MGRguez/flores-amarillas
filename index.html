<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Flores Amarillas 🌻</title>

<style>

body{
background:#fffbe6;
font-family:Arial;
text-align:center;
overflow:hidden;
}

h1{
margin-top:120px;
color:#f4b400;
font-size:42px;
}

p{
font-size:22px;
color:#555;
}

.flower{
position:absolute;
top:-50px;
font-size:30px;
animation:fall linear infinite;
}

@keyframes fall{
0%{transform:translateY(0)}
100%{transform:translateY(100vh)}
}

</style>
</head>

<body>

<h1 id="titulo">🌻 Para ti</h1>

<p>
Aunque la distancia exista tus flores amarillas siempre llegarán 💛<br>
</p>

<script>

const params = new URLSearchParams(window.location.search);

const nombre = params.get("nombre");

if(nombre){
document.getElementById("titulo").innerHTML =
"🌻 Para ti, " + nombre;
}

function crearFlor(){

const flor = document.createElement("div");

flor.classList.add("flower");

flor.innerHTML="🌻";

flor.style.left=Math.random()*100+"vw";

flor.style.animationDuration=
(Math.random()*5+5)+"s";

document.body.appendChild(flor);

setTimeout(()=>{

flor.remove()

},10000)

}

setInterval(crearFlor,400);

</script>

</body>
</html>
